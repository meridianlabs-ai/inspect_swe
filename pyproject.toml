[build-system]
# Cap hatchling <1.30: 1.30.0 emits core metadata 2.5 (PEP 794), which PyPI
# does not yet accept (https://github.com/pypi/warehouse/issues/19083).
# Relax once warehouse supports metadata 2.5.
requires = ["hatchling<1.30", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "inspect_swe"
dynamic = ["version"]
description = "Software engineering agents for Inspect AI."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
dependencies = [
    "httpx",
    "inspect-ai>=0.3.280",
    "nest_asyncio",
    "platformdirs",
    "pydantic>=2.13.0",
    "pyyaml",
    "sniffio",
    "anyio",
    "typing_extensions>=4.9.0",
    "agent-client-protocol>=0.11.0",
]

[project.urls]
Documentation = "https://meridianlabs-ai.github.io/inspect_swe/"
"Source Code" = "https://github.com/meridianlabs-ai/inspect_swe"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_swe/issues"

[project.entry-points.inspect_ai]
inspect_swe = "inspect_swe._registry"


[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    # The nightly slow suite (meridianlabs-ai/actions
    # inspect-swe-nightly-tests.yml) installs this extra from uv.lock and
    # runs pytest with -n auto and --timeout; google-genai lets the
    # gemini_cli tests run there (with GOOGLE_API_KEY set they fail with
    # PrerequisiteError without it, rather than skip).
    "pytest-timeout",
    "pytest-xdist",
    "google-genai>=3.0.0",  # inspect_ai's Google provider floor (providers.py)
    # Floors required by inspect_ai's sandbox agent bridge (see
    # inspect_ai/model/_providers/providers.py). Without explicit floors a lock
    # regeneration can resolve below them, and bridge-backed tests then fail
    # with an opaque "Model proxy process exited unexpectedly".
    "anthropic>=1.0.0",
    "openai>=3.1.0",
    "pytest-dotenv",
    "types-PyYAML",
    "IPython",
    "inspect-evals",
    "inspect_k8s_sandbox",
    "mini-swe-agent",
]
doc = [
    "quarto-cli>=1.9.36",
    "griffe>=2",
    "panflute",
    "markdown",
    "rich",
]

[tool.uv]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# 6 hours only for direct dependencies that are a model provider SDK or an
# Inspect package; see CONTRIBUTING.md.
[tool.uv.exclude-newer-package]
anthropic = "6 hours"
google-genai = "6 hours"
inspect-ai = "6 hours"
openai = "6 hours"

# Development and CI track inspect_ai main. uv.lock records a commit, and CI
# moves it to main's latest before installing (.github/actions/uv-sync). Only uv
# reads this; the published package requires the inspect-ai floor above, and
# the release PR's CI installs the newest release instead.
[tool.uv.sources]
inspect-ai = { git = "https://github.com/UKGovernmentBEIS/inspect_ai", branch = "main" }

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_swe/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
python_executable = ".venv/bin/python"

# google-antigravity is a sandbox-only runtime dependency (the SDK runs inside the
# Inspect sandbox, not on the host), so it is intentionally not a project dependency
# and ships no py.typed marker. sdk_runner.py imports it only in-sandbox; tell mypy
# not to require types for it on the host.
[[tool.mypy.overrides]]
module = ["google.antigravity.*"]
ignore_missing_imports = true

# inspect_cyber is only used by examples/ (guarded by a try/except with install
# instructions) and is not a project dependency; tell mypy not to require types
# for it when checking examples on the host.
[[tool.mypy.overrides]]
module = ["inspect_cyber.*"]
ignore_missing_imports = true
