name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
    with:
      # Publish + the approval gate live in publish.yml (a separate `on: release`
      # run), so the approval ping is posted from there (deep-links to the paused
      # run), not from this workflow.
      approval-ping: false
      # Empty on push → default branch. On workflow_dispatch, targets the given
      # maintenance branch to cut a hotfix release from a released tag.
    secrets: inherit
