name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  # Detect whether anything outside docs changed, so the build matrix can be
  # skipped on documentation-only changes.
  #
  # The skip lives on the STEPS of each matrix job, not on the job itself. The
  # `main` ruleset requires the versioned check names (`py-ruff (3.11)`, ...),
  # and a job skipped by a job-level `if` never expands its matrix: it reports a
  # single unversioned check (`py-ruff`), so the required contexts stay
  # "Expected" forever and a docs-only PR can never merge. With the condition on
  # the steps, every matrix leg runs, skips all its steps in seconds, and
  # reports its versioned name with a `success` conclusion.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  py-ruff:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Ruff
        if: needs.changes.outputs.build == 'true'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - name: Format with Ruff
        if: needs.changes.outputs.build == 'true'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

  py-mypy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: needs.changes.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Run mypy
        if: needs.changes.outputs.build == 'true'
        run: |
          mypy --python-executable "$(which python)"

  py-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: needs.changes.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Run tests
        if: needs.changes.outputs.build == 'true'
        run: pytest

  py-build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        if: needs.changes.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        if: needs.changes.outputs.build == 'true'
        run: python -m build
      - name: Verify package
        if: needs.changes.outputs.build == 'true'
        run: |
          python -m pip install dist/*.whl
          python -c "import inspect_swe; print('Package imported successfully')"
