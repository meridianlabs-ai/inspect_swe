name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Every job here only reads the repo. State that rather than inheriting the
# repo default.
permissions:
  contents: read

jobs:
  # Detect whether anything outside docs changed, so the build matrix can be
  # skipped on documentation-only changes.
  #
  # The skip lives on the STEPS of each matrix job, not on the job itself. The
  # `main` ruleset requires the versioned check names (`py-ruff (3.11)`, ...),
  # and a job skipped by a job-level `if` never expands its matrix: it reports a
  # single unversioned check (`py-ruff`), so the required contexts stay
  # "Expected" forever and a docs-only PR can never merge. With the condition on
  # the steps, every matrix leg runs, skips all its steps in seconds, and
  # reports its versioned name with a `success` conclusion.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  py-ruff:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.build == 'true'
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Lint with Ruff
        if: needs.changes.outputs.build == 'true'
        run: uv run --no-sync ruff check
      - name: Format with Ruff
        if: needs.changes.outputs.build == 'true'
        run: uv run --no-sync ruff format --check
      - name: Minimize uv cache
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
        run: uv cache prune --ci

  py-mypy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.build == 'true'
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run mypy
        if: needs.changes.outputs.build == 'true'
        run: uv run --no-sync mypy
      - name: Minimize uv cache
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
        run: uv cache prune --ci

  py-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.build == 'true'
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        if: needs.changes.outputs.build == 'true'
        run: uv run --no-sync pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
        run: uv cache prune --ci

  py-build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build toolchain that publish.yml uses, pinned with hashes. To
      # update the file, see publish.yml.
      - name: Install build toolchain
        if: needs.changes.outputs.build == 'true'
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: hashed-requirements
          python-version: ${{ matrix.python-version }}
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          environment-dir: ${{ runner.temp }}/build-venv
          actions-cache: none
      - name: Build package
        id: build
        if: needs.changes.outputs.build == 'true'
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
      # The locked runtime dependencies, without the project, then the wheel
      # with --no-deps. A second call in a job must use the first call's
      # actions-cache.
      - if: needs.changes.outputs.build == 'true'
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
          actions-cache: none
      - name: Verify package
        if: needs.changes.outputs.build == 'true'
        # -I so the import resolves to the installed wheel, not the checkout's src/.
        run: .venv/bin/python -I -c "import inspect_swe; print('Package imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
        run: uv cache prune --ci
