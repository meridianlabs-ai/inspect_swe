name: Publish Package

on:
  # Auto-publish when Release Please cuts a GitHub Release (App token triggers
  # this). Runs in-repo, so the PyPI trusted-publisher config (workflow
  # publish.yml) is unchanged.
  release:
    types: [published]
  # Manual break-glass path.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

jobs:
  # Post the "awaiting approval" Slack ping — un-gated, in this same run, so it
  # deep-links to the run whose publish job is paused on the pypi environment.
  notify-approval:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: meridianlabs-ai/actions/slack-approval-ping@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
        with:
          webhook: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          approvers: "jjallaire dragonstyle epatey"
          message: ":rocket: *${{ github.repository }}* ${{ github.event.release.tag_name }} — PyPI publish is *awaiting approval*."
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # A manual run builds and publishes the selected ref's code with the PyPI
  # credential, so it may run only from main or the tag of a published
  # release. This job checks that without checking out any code, and build
  # and publish need it, so a dispatch from any other ref fails here and build
  # and publish never start. Release events skip the check and publish as before.
  check-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Allow only main or a release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # An explicit bash shell adds pipefail, so a failed release lookup
        # refuses the ref even if its output looks like a release.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main)
              exit 0
              ;;
            refs/tags/*)
              tag="${REF#refs/tags/}"
              encoded="$(jq -rn --arg t "$tag" '$t | @uri')"
              if gh api "repos/$REPO/releases/tags/$encoded" \
                  | jq -e --arg t "$tag" '.tag_name == $t and .draft == false' > /dev/null; then
                exit 0
              fi
              echo "::error::Refusing to publish from $REF: no published release has this tag."
              exit 1
              ;;
          esac
          echo "::error::Refusing to publish from $REF: dispatch this workflow from main or a release tag."
          exit 1

  # The build runs in the shared workflow, in a job with no publishing
  # credential. It uses the hashed scripts/build-dist/requirements.txt, which
  # Dependabot updates. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.11 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    needs: check-ref
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@378070a4dd5c735a790016981ee144e71ed0b3f3 # main
    with:
      python-version: "3.11"

  publish:
    needs: [check-ref, build]
    if: ${{ github.event_name == 'release' || inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-swe

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Deploy the docs site for this release once the package is on PyPI.
  docs:
    needs: publish
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: meridianlabs-ai/actions/.github/workflows/publish-docs.yml@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
    with:
      python-version: "3.14"
      extras: doc
