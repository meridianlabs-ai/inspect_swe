name: Publish Package

on:
  # Auto-publish when Release Please cuts a GitHub Release (App token triggers
  # this). Runs in-repo, so the PyPI trusted-publisher config (workflow
  # publish.yml) is unchanged.
  release:
    types: [published]
  # Manual break-glass path.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

jobs:
  # Post the "awaiting approval" Slack ping — un-gated, in this same run, so it
  # deep-links to the run whose publish job is paused on the pypi environment.
  notify-approval:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: meridianlabs-ai/actions/slack-approval-ping@v1
        with:
          webhook: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          approvers: "jjallaire dragonstyle epatey"
          message: ":rocket: *${{ github.repository }}* ${{ github.event.release.tag_name }} — PyPI publish is *awaiting approval*."
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # A manual run builds and publishes the selected ref's code with the PyPI
  # credential, so it may run only from main or the tag of a published
  # release. This job checks that without checking out any code, and publish
  # needs it, so a dispatch from any other ref fails here and publish never
  # starts. Release events skip the check and publish as before.
  check-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Allow only main or a release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # An explicit bash shell adds pipefail, so a failed release lookup
        # refuses the ref even if its output looks like a release.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main)
              exit 0
              ;;
            refs/tags/*)
              tag="${REF#refs/tags/}"
              encoded="$(jq -rn --arg t "$tag" '$t | @uri')"
              if gh api "repos/$REPO/releases/tags/$encoded" \
                  | jq -e --arg t "$tag" '.tag_name == $t and .draft == false' > /dev/null; then
                exit 0
              fi
              echo "::error::Refusing to publish from $REF: no published release has this tag."
              exit 1
              ;;
          esac
          echo "::error::Refusing to publish from $REF: dispatch this workflow from main or a release tag."
          exit 1

  publish:
    needs: check-ref
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-swe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Get all tags for version detection
          persist-credentials: false

      # The build frontend and backend come from scripts/build-dist/requirements.txt,
      # pinned with hashes, and the build runs without isolation, so nothing
      # else is resolved at build time. Dependabot updates the file weekly with
      # a 7-day cooldown; it lives outside .github/ because Dependabot changes
      # files there only for github-actions. This job holds id-token, so it
      # restores no Actions cache. To update the file by hand, run in
      # scripts/build-dist:
      #   uv pip compile --no-config --generate-hashes --python-version 3.11 \
      #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
      #     --only-binary :all: --upgrade requirements.in -o requirements.txt
      - name: Install build toolchain
        uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: hashed-requirements
          python-version: "3.11"
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          actions-cache: none
          environment-dir: ${{ runner.temp }}/build-venv

      - name: Show current version
        run: |
          echo "Version: $(git describe --tags --always)"

      - name: Build
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          ls -la dist/

      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || inputs.confirm == 'yes' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Deploy the docs site for this release once the package is on PyPI.
  docs:
    needs: publish
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: meridianlabs-ai/actions/.github/workflows/publish-docs.yml@v1
    with:
      python-version: "3.14"
      extras: doc
